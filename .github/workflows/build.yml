name: Sütősegéd

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip kicsomagolása, ha van
        run: |
          # A legmagasabb verziószámú sutoseged-vN.zip nyer; ha nincs, bármelyik zip.
          ZIP=$(ls -1 sutoseged-v*.zip 2>/dev/null | sort -V | tail -1)
          [ -z "$ZIP" ] && ZIP=$(ls -1 *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "Nincs zip, a repóban lévő forrásból fordulunk."
            exit 0
          fi
          echo "Kicsomagolás: $ZIP"
          unzip -q -o "$ZIP" -d tmp
          SETTINGS=$(find tmp -name 'settings.gradle.kts' | head -1)
          [ -z "$SETTINGS" ] && { echo "A zipben nincs settings.gradle.kts"; exit 1; }
          ROOT=$(dirname "$SETTINGS")
          # A .github mappát NEM írjuk felül: a GitHub nem engedi, hogy egy futás
          # a saját workflow-fájlját módosítsa, és akkor semmi nem kerülne be.
          rsync -a --exclude '.github/' "$ROOT"/ ./
          rm -rf tmp
          rm -f *.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Forrás frissítve: $ZIP"
            git push
          fi

      - name: Ellenőrzés
        run: test -f settings.gradle.kts || { echo "HIANYZIK a settings.gradle.kts"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fordítás
        run: |
          gradle assembleDebug --no-daemon \
            -PappVersionName=1.0.${{ github.run_number }} \
            -PappVersionCode=${{ github.run_number }}

      - name: APK elnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk sutoseged-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sutoseged-1.0.${{ github.run_number }}
          path: sutoseged-1.0.${{ github.run_number }}.apk

      - name: Kiadás közzététele
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sütősegéd 1.0.${{ github.run_number }}
          files: sutoseged-1.0.${{ github.run_number }}.apk
          
